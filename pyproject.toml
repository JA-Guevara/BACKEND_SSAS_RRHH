[project]
name = "backend-ssah-rrhh"
version = "0.1.0"
description = "Backend para SSAH RRHH"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pydantic[email]>=2.7.0",
  "pydantic-settings>=2.4.0",
  "PyJWT>=2.8.0",
  "pwdlib[argon2]>=0.2.0",
  "python-dotenv>=1.0.1",
  "psycopg[binary]>=3.1.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
ignore = ["B008"]

[tool.setuptools.packages.find]
where = ["src"]
